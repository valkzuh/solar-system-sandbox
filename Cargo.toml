[package]
name = "solar_system_sandbox"
version = "0.2.0"
edition = "2021"
description = "Realistic real-time solar system sandbox: Rust web server + WebGL2 (three.js) frontend."
license = "MIT"
default-run = "solar_system_sandbox"

[dependencies]
anyhow = "1.0"
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "fs"] }
tower-http = { version = "0.5", features = ["fs", "compression-gzip", "set-header"] }

[profile.release]
opt-level = 3
